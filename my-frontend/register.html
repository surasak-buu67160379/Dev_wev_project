<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>FacePlay - Register</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background: #047857;
        }

        .btn-back {
            background: #4b5563;
            margin-top: 10px;
        }

        .btn-back:hover {
            background: #374151;
        }

        #msg {
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>สมัครสมาชิก</h2>
        <input type="text" id="reg-user" placeholder="เลือก Username" oninput="checkUsernameAvailable()">
        <input type="password" id="reg-pass" placeholder="ตั้งรหัสผ่าน">
        <button onclick="submitRegister()">ยืนยันการสมัคร</button>
        <button class="btn-back" onclick="window.location.href='index.html'">กลับหน้า Login</button>
        <p id="msg"></p>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        // ตรวจสอบ Username ว่าว่างไหม (GET /check-username/{name})
        async function checkUsernameAvailable() {
            const name = document.getElementById("reg-user").value;
            const msg = document.getElementById("msg");
            if (!name) { msg.innerText = ""; return; }

            try {
                const res = await fetch(`${API_URL}/check-username/${name}`);
                const data = await res.json();
                if (res.available) {
                    msg.style.color = "#34d399";
                    msg.innerText = "✔️ " + data.message;
                } else {
                    msg.style.color = "#f87171";
                    msg.innerText = "❌ " + data.message;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function submitRegister() {
            const username = document.getElementById("reg-user").value;
            const password = document.getElementById("reg-pass").value;
            const msg = document.getElementById("msg");

            if (!username || !password) {
                msg.style.color = "#f87171";
                msg.innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    alert("สมัครสมาชิกสำเร็จ! กำลังกลับไปหน้าล็อกอิน");
                    window.location.href = "index.html";
                } else {
                    msg.style.color = "#f87171";
                    msg.innerText = data.detail || "สมัครไม่สำเร็จ";
                }
            } catch (e) {
                msg.style.color = "#f87171";
                msg.innerText = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
            }
        }
    </script>
</body>

</html>
