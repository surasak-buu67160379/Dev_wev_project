services:
  # กล่องหน้าบ้าน (เหมือนเดิม)
  frontend:
    build: ./my-frontend
    ports:
      - "8080:80"

  # กล่องหลังบ้าน (เหมือนเดิม)
  api:
    build: ./my-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/mydb
    depends_on:
      - db

  # 🆕 กล่องฐานข้อมูล PostgreSQL (เพิ่มเข้ามาใหม่ตรงนี้)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: